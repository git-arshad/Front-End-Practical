<!DOCTYPE html>
<html>
<head>
    <title>Responsive Courses</title>

    <style>
        /* Desktop */
        .courses {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 30px;
        }

        .course {
            background-color: lightgray;
            padding: 20px;
            width: 250px;
            text-align: center;
            border-radius: 10px;
        }

        .course:hover {
            background-color: lightblue;
            transform: scale(1.05);
        }

        .course button {
            padding: 8px 15px;
            background-color: blue;
            color: white;
            border: none;
        }


        /* Tablet */
        @media (max-width: 900px) {
            .courses {
                justify-content: center;
            }

            .course {
                width: 40%;
            }
        }


        /* Mobile */
        @media (max-width: 600px) {
            .courses {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }

            .course {
                width: 90%;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <section class="courses">

        <div class="course">
            <h3>Web Development</h3>
            <p>HTML, CSS and JavaScript</p>
            <button>View Course</button>
        </div>

        <div class="course">
            <h3>Java Programming</h3>
            <p>Core Java and OOPs</p>
            <button>View Course</button>
        </div>

        <div class="course">
            <h3>Database</h3>
            <p>SQL and MongoDB</p>
            <button>View Course</button>
        </div>

    </section>

</body>
</html>
