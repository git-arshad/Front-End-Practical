<!DOCTYPE html>
<html>
<head>
    <title>Navigation Menu</title>

    <style>
        nav {
            background-color: lightgray;
            padding: 15px;
        }

        nav a {
            text-decoration: none;
            color: black;
            padding: 10px 20px;
            margin: 5px;
        }

        /* Hover effect */
        nav a:hover {
            background-color: blue;
            color: white;
        }

        /* Active effect */
        nav a:active {
            background-color: red;
            color: white;
        }

        /* Alternate navigation items */
        nav a:nth-child(even) {
            background-color: lightgreen;
        }

        nav a:nth-child(odd) {
            background-color: lightyellow;
        }

        /* Input focus */
        input:focus {
            border: 3px solid blue;
            background-color: lightblue;
        }

        /* Button active */
        button:active {
            background-color: green;
            color: white;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">Courses</a>
        <a href="#">Students</a>
        <a href="#">Contact</a>
    </nav>

    <br>

    <input type="text" placeholder="Enter your name">

    <button>Submit</button>

</body>
</html>
